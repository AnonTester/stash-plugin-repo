name: JAVStash Performer Search Cleanup
description: >-
  Cleans up performer searches against the JAVStash stash-box (the performer
  "Scrape with -> JAVStash" dialog and the performer tagger search). Drops the
  unrelated performers JAVStash pads its answer with when nothing matches, also
  searches the reversed word order (First Last <-> Last First), and ranks the
  rest by how well name/aliases match. Only JAVStash performer searches are
  affected: scene searches and the other stash-boxes are left alone.
version: 1.0.1
ui:
  javascript:
    - javstashPerformerSearchCleanup.js
