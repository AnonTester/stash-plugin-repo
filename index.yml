  sha256: 004864354ccb3564a45f02121bbd341a6f35310b907230338a66cb45cd1a8e93
  requires: []
  metadata:
    description: Makes performer searches against the stash-boxes (Scrape with
      stash-box, performer tagger) return what was asked for. Several search
